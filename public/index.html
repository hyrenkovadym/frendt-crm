 const sel=box.querySelector('#chMeSel');if(sel)sel.onchange=()=>{chMeLocal=sel.value;try{localStorage.setItem(CH_KEY+'_me',chMeLocal)}catch(e){}chRender();refreshChatBadges()};
 box.querySelector('#chAddM').onclick=()=>{const p=box.querySelector('#chPeople');p.hidden=!p.hidden};
 box.querySelector('#chAddSel').onchange=async e=>{if(e.target.value&&await chAct(id,{type:'add',name:e.target.value}))chRender()};
 box.querySelectorAll('[data-chrm]').forEach(b=>b.onclick=async()=>{if(await chAct(id,{type:'remove',name:b.dataset.chrm}))chRender()});
 box.querySelectorAll('[data-chr]').forEach(b=>b.onclick=async()=>{const [m,e]=b.dataset.chr.split('|');if(await chAct(id,{type:'react',msg:m,emoji:e}))chRender()});
 box.querySelectorAll('[data-chpin]').forEach(b=>b.onclick=async e=>{e.stopPropagation();if(await chAct(id,{type:'pin',msg:b.dataset.chpin}))chRender()});
 box.querySelectorAll('[data-chgo]').forEach(b=>b.onclick=()=>{const el=box.querySelector(`[data-mid="${b.dataset.chgo}"]`);if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.add('ch-flash');setTimeout(()=>el.classList.remove('ch-flash'),1600)}});
 box.querySelectorAll('[data-chtask]').forEach(b=>b.onclick=()=>chToTask(id,b.dataset.chtask));
 box.querySelectorAll('[data-chedit]').forEach(b=>b.onclick=()=>{const m=c.msgs.find(x=>x.id===b.dataset.chedit&&x.who===me_&&!x.sys);if(!m)return;chState.reply=null;chState.edit=m.id;chState.files=[];chRender();const t=box.querySelector('#chTa');if(t){t.value=m.text||'';t.style.height=Math.min(140,t.scrollHeight)+'px';t.focus();t.setSelectionRange(t.value.length,t.value.length)}});
 box.querySelectorAll('[data-chq]').forEach(b=>b.onclick=()=>{if(!member){toast('Спершу приєднайтеся до обговорення','');return}chState.edit=null;chState.reply=b.dataset.chq;chRender();box.querySelector('#chTa')?.focus()});
 const j=box.querySelector('#chJoin');if(j)j.onclick=async()=>{if(await chAct(id,{type:'join'}))chRender()};
 if(!member)return;
 const ta=box.querySelector('#chTa'),pop=box.querySelector('#chPop');let pi=0,pl=[];
 const rx=box.querySelector('#chRx');if(rx)rx.onclick=()=>{chState.reply=null;chRender()};
 const ex=box.querySelector('#chEx');if(ex)ex.onclick=()=>{chState.edit=null;chRender();box.querySelector('#chTa')?.focus()};
 box.querySelectorAll('[data-chfx]').forEach(b=>b.onclick=()=>{chState.files.splice(+b.dataset.chfx,1);chRender()});
 const fileInput=box.querySelector('#chFile');if(fileInput)fileInput.onchange=e=>chAddFiles(e.target.files,id);
 const ins=t=>{const a=ta.selectionStart,b2=ta.selectionEnd;ta.value=ta.value.slice(0,a)+t+ta.value.slice(b2);ta.selectionStart=ta.selectionEnd=a+t.length;ta.focus();ta.dispatchEvent(new Event('input'))};
 const emo=box.querySelector('#chEmo');box.querySelector('#chEmoBtn').onclick=()=>{emo.hidden=!emo.hidden};
 box.querySelectorAll('[data-che]').forEach(b=>b.onclick=()=>{ins(b.dataset.che);emo.hidden=true});
 box.querySelectorAll('[data-chqk]').forEach(b=>b.onclick=()=>{ins((ta.value&&!/\s$/.test(ta.value)?' ':'')+CH_QUICK[+b.dataset.chqk])});
 const pane=box;pane.ondragover=e=>{if(!edit&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();pane.classList.add('ch-drop')}};pane.ondragleave=e=>{if(e.target===pane||!pane.contains(e.relatedTarget))pane.classList.remove('ch-drop')};
 pane.ondrop=e=>{if([...e.dataTransfer.types].includes('Files'))e.preventDefault();pane.classList.remove('ch-drop');if(!edit)chAddFiles(e.dataTransfer.files,id)};
 const showPop=()=>{const m=/@([^@\n]{0,25})$/.exec(ta.value.slice(0,ta.selectionStart));if(!m){pop.style.display='none';return}const s=m[1].toLowerCase();pl=chPeople().filter(p=>p.n!==me_&&p.n.toLowerCase().includes(s)).slice(0,8);if(!pl.length){pop.style.display='none';return}pi=Math.min(pi,pl.length-1);pop.innerHTML=pl.map((p,i)=>`<div class="${i===pi?'on':''}" data-pi="${i}">${chAv(p.n,'s')}<span>${esc(p.n)}<small>${esc(p.r)}${c.members.includes(p.n)?'':' · додасться в чат'}</small></span></div>`).join('');pop.style.display='block';pop.querySelectorAll('[data-pi]').forEach(d=>d.onmousedown=e=>{e.preventDefault();pick(+d.dataset.pi)})};
 const pick=i=>{const p=pl[i];const pos=ta.selectionStart;const before=ta.value.slice(0,pos).replace(/@([^@\n]{0,25})$/,'@'+p.n+' ');ta.value=before+ta.value.slice(pos);ta.selectionStart=ta.selectionEnd=before.length;pop.style.display='none';ta.focus()};
 ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(140,ta.scrollHeight)+'px';pi=0;showPop()};
 ta.onpaste=e=>{const imgs=[...(e.clipboardData?.items||[])].filter(x=>x.kind==='file'&&x.type.startsWith('image/')).map(x=>x.getAsFile()).filter(Boolean);if(!edit&&imgs.length){e.preventDefault();chAddFiles(imgs,id)}};
 ta.onkeydown=e=>{if(e.key==='Escape'&&edit){e.preventDefault();chState.edit=null;chRender();box.querySelector('#chTa')?.focus();return}if(pop.style.display==='block'){if(e.key==='ArrowDown'){pi=(pi+1)%pl.length;showPop();e.preventDefault();return}if(e.key==='ArrowUp'){pi=(pi-1+pl.length)%pl.length;showPop();e.preventDefault();return}if(e.key==='Enter'||e.key==='Tab'){pick(pi);e.preventDefault();return}if(e.key==='Escape'){pop.style.display='none';return}}if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
 box.querySelector('#chSend').onclick=send;
 async function send(){if(chState.uploading){toast('Зачекайте','Файли ще завантажуються');return}const t=ta.value.trim();if(edit){if(!t&&!(edit.files||[]).length){toast('Повідомлення порожнє','Введіть текст або скасуйте редагування');ta.focus();return}const ok=await chAct(id,{type:'edit',msg:edit.id,text:t});if(!ok)return;chState.edit=null;ta.value='';chRender();refreshChatBadges();dcChatBadge();box.querySelector('#chTa')?.focus();return}if(!t&&!chState.files.length){ta.focus();return}const ok=await chAct(id,{type:'msg',text:t,files:chState.files.slice(),reply:chState.reply});if(!ok)return;chState.reply=null;chState.files=[];ta.value='';chRender();refreshChatBadges();dcChatBadge();box.querySelector('#chTa')?.focus()}}
/* сповіщення як у Telegram: коли вас згадали (@) — картка справа знизу висить, поки не закриєте × або не відкриєте */
const NT_KEY=CH_KEY+'_seen';let ntSeen={};try{ntSeen=JSON.parse(localStorage.getItem(NT_KEY)||'{}')||{}}catch(e){}
const ntSave=()=>{try{localStorage.setItem(NT_KEY,JSON.stringify(ntSeen))}catch(e){}};
function ntList(){const me_=chMe(),seen=new Set(ntSeen[me_]||[]),out=[];for(const [id,c] of Object.entries(CHAT)){const last=c.read?.[me_]||0;for(const m of c.msgs||[]){if(m.sys||m.who===me_||!(m.text||'').includes('@'+me_)||m.t<=last||seen.has(m.id))continue;out.push({req:+id,m})}}return out.sort((a,b)=>b.m.t-a.m.t)}
function ntDismiss(ids){const me_=chMe();ntSeen[me_]=[...new Set([...(ntSeen[me_]||[]),...ids])].slice(-500);ntSave()}
function ntAgo(t){const s=Math.round((Date.now()-t)/1000);if(s<60)return 'щойно';if(s<3600)return Math.floor(s/60)+' хв тому';if(s<86400)return Math.floor(s/3600)+' год тому';return chHM(t)+' · '+new Date(t).toLocaleDateString('uk-UA')}
function notifCheck(){bellRender();let box=document.querySelector('#chNotifs');if(!box){box=document.createElement('div');box.id='chNotifs';document.body.appendChild(box)}
 const L=ntList();const shown=L.slice(0,4);
 box.innerHTML=shown.map(({req,m})=>{const r=requests.find(x=>x.id===req);const cli=r?cl(r).client:'';return `<div class="nt" data-nt="${esc(m.id)}" data-nreq="${req}" role="button" tabindex="0"><button type="button" class="nt-x" data-ntx="${esc(m.id)}" aria-label="Закрити">×</button>${chAv(m.who)}<div class="nt-b"><div class="nt-top"><b>${esc(m.who)}</b><span>згадав(ла) вас · ${ntAgo(m.t)}</span></div><div class="nt-req">Заявка №${req}${cli?' · '+esc(cli):''}</div><div class="nt-txt">${chText(m.text)}</div><div class="nt-go">Відкрити обговорення →</div></div></div>`}).join('')+(L.length>4?`<div class="nt-more">ще ${L.length-4} згадок <button type="button" id="ntAll">закрити всі</button></div>`:'');
 box.querySelectorAll('[data-ntx]').forEach(b=>b.onclick=e=>{e.stopPropagation();ntDismiss([b.dataset.ntx]);notifCheck()});
 box.querySelectorAll('[data-nt]').forEach(n=>n.onclick=()=>{const id=+n.dataset.nreq;ntDismiss(ntList().filter(x=>x.req===id).map(x=>x.m.id));openDrawer(id);chState.tab='chat';dcTabs();notifCheck()});
 const all=box.querySelector('#ntAll');if(all)all.onclick=()=>{ntDismiss(L.map(x=>x.m.id));notifCheck()}}
setInterval(()=>notifCheck(),5000);setTimeout(()=>notifCheck(),800);
const CH_QUICK=['Виставте рахунок, будь ласка','Оплата надійшла ✅','Коли відвантаження?','Потрібен виїзд техніка','Погодьте, будь ласка','Зроблено 👍'];
const CH_EMO=['👍','✅','🔥','🙏','👌','😊','😂','😮','🤝','💰','🚜','🌾','📦','📞','⏰','❗','❓','🎉'];
/* «📋 Зробити задачею»: з повідомлення — у «Задачі менеджерів» з клієнтом заявки */
function chToTask(id,mid){const c=CHAT[id],m=c?.msgs.find(x=>x.id===mid),r=requests.find(x=>x.id===id);if(!m||!r||typeof openTask!=='function')return;const k=cl(r);openTask(0);const f=document.querySelector('#taskForm');if(!f)return;
 const tm=new Date(Date.now()+864e5),iso=`${tm.getFullYear()}-${String(tm.getMonth()+1).padStart(2,'0')}-${String(tm.getDate()).padStart(2,'0')}`;
 const set=(n,v)=>{const e=f.elements[n];if(e&&v&&!e.disabled){e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}))}};
 set('edrpou',k.edrpou||r.edrpou);set('company',k.client);set('region',k.region);set('district',k.district);set('lpr',k.contact);set('phone',k.phone1);set('email',k.email);
 let tt=m.text||'Задача з чату';chPeople().forEach(p=>{tt=tt.split('@'+p.n).join('')});set('task',tt.replace(/\s+/g,' ').trim().slice(0,120)||'Задача з чату');set('c1',`З чату заявки №${id} · ${m.who}: ${m.text||''}`.slice(0,900));set('callDate',iso);toast('Задачу заповнено з повідомлення','Перевірте й натисніть «Зберегти»')}
/* дзвіночок у шапці: лічильник згадок і історія */
function bellRender(){const b=document.querySelector('#notifyBtn');if(!b)return;const n=ntList().length;let bd=b.querySelector('.bell-n');if(!bd){bd=document.createElement('span');bd.className='bell-n';b.appendChild(bd)}bd.textContent=n?String(n):'';bd.hidden=!n}
function bellHistory(){const me_=chMe(),all=[];for(const [id,c] of Object.entries(CHAT))for(const m of c.msgs||[])if(!m.sys&&m.who!==me_&&(m.text||'').includes('@'+me_))all.push({req:+id,m});all.sort((a,b)=>b.m.t-a.m.t);
 let p=document.querySelector('#bellPanel');if(p){p.remove();return}p=document.createElement('div');p.id='bellPanel';
 p.innerHTML=`<div class="bp-h">Згадки про вас <button type="button" id="bpX">×</button></div>${all.slice(0,30).map(({req,m})=>{const r=requests.find(x=>x.id===req),act=ntList().some(x=>x.m.id===m.id);return `<div class="bp-i${act?' new':''}" data-bpr="${req}">${chAv(m.who,'s')}<div><b>${esc(m.who)}</b> <small>${ntAgo(m.t)}</small><div class="bp-r">№${req}${r?' · '+esc(cl(r).client||''):''}</div><div class="bp-t">${esc((m.text||'').slice(0,110))}</div></div></div>`}).join('')||'<div class="bp-e">Вас ще ніхто не згадував</div>'}`;
 document.body.appendChild(p);p.querySelector('#bpX').onclick=()=>p.remove();p.querySelectorAll('[data-bpr]').forEach(e=>e.onclick=()=>{const id=+e.dataset.bpr;p.remove();ntDismiss(ntList().filter(x=>x.req===id).map(x=>x.m.id));openDrawer(id);chState.tab='chat';dcTabs();notifCheck()})}
document.querySelector('#notifyBtn').onclick=e=>{e.stopPropagation();bellHistory()};
document.addEventListener('click',e=>{const p=document.querySelector('#bellPanel');if(p&&!p.contains(e.target))p.remove()});
/* значок обговорення на картках канбану */
function refreshChatBadges(){setTimeout(notifCheck,0);chatNavBadge();document.querySelectorAll('.board .card[data-id]').forEach(card=>{const id=+card.dataset.id,c=CHAT[id];card.querySelector('.ch-badge')?.remove();if(!c||!c.msgs.some(m=>!m.sys))return;const u=chUnread(id);const n=c.msgs.filter(m=>!m.sys).length;const top=card.querySelector('.card-top');if(!top)return;top.insertAdjacentHTML('beforeend',`<span class="ch-badge${u.n?' new':''}${u.m?' at':''}" title="${u.n?u.n+' нових повідомлень':'Обговорення: '+n}">💬 ${u.n?(u.m?'@':'')+u.n:n}</span>`)})}
