services:
  - type: web
    name: frendt-crm
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: echo no build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /tmp/frendt-crm-data
      - key: NODE_VERSION
        value: "22"
      - key: CRM_USERNAME
        value: VolodymyrHirenko
      - key: CRM_PASSWORD
        sync: false
