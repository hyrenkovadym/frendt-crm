services:
  - type: web
    name: frendt-crm
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: echo no build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: NODE_VERSION
        value: "22"
      - key: CRM_USERNAME
        value: VolodymyrHirenko
      - key: CRM_PASSWORD
        sync: false
    # Keep the SQLite database and daily backups across deploys.
    disk:
      name: frendt-crm-data
      mountPath: /var/data
      sizeGB: 1
